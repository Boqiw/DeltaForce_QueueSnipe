<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>撞车监测</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f3f5f7;color:#1f2430;margin:0;padding:24px 20px}
.top{max-width:1040px;margin:0 auto 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{margin:0;font-size:22px}
.sub{margin:6px 0 0;color:#6b7280;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;background:#e8f3ff;color:#1460c8;border-radius:999px;padding:6px 12px;font-size:12px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#22a06b;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.card{max-width:1040px;margin:0 auto 16px;background:#fff;border:1px solid #e4e7ee;border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.card-head h2{margin:0;font-size:16px}
.count{color:#6b7280;font-size:12px}
.tbl{max-height:560px;overflow:auto;border:1px solid #e9ebf0;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{position:sticky;top:0;z-index:1;background:#f8f9fb;text-align:left;font-weight:600;color:#4b5563;padding:10px 14px;border-bottom:1px solid #e4e7ee;white-space:nowrap}
tbody td{padding:10px 14px;border-bottom:1px solid #eef0f4;text-align:left;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f6f9ff}
.c-name{width:44%}
.who{display:flex;align-items:center;gap:8px}
.who b{font-weight:600}
.meta{color:#9aa1ac;font-size:12px;margin-top:3px;line-height:1.4}
.badge{flex:0 0 auto;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:500}
.badge.live{background:#e3f7ec;color:#0e8a4e}.badge.starting{background:#e3f0ff;color:#1460c8}
.badge.reconnecting{background:#fff3e0;color:#c26a00}.badge.standby{background:#eef0f4;color:#5b6472}
.badge.off{background:#fff;color:#8a94a3;border:1px dashed #c8d0db}
.c-view{width:18%;font-variant-numeric:tabular-nums}
.c-code{width:38%}
code{font-family:Consolas,"SF Mono",Menlo,monospace;background:#f1f3f7;border:1px solid #e4e7ee;border-radius:6px;padding:3px 8px;font-size:13px;color:#0b1220}
.na{color:#c2c8d2}
.empty,.none{text-align:center!important;color:#9aa1ac;padding:18px!important}
.evt{list-style:none;margin:0;padding:0}
.evt li{padding:9px 4px;border-bottom:1px solid #eef0f4;font-size:14px}
.evt li:last-child{border-bottom:none}
.evt .hit{background:#fff8db;border-radius:8px;padding:9px 12px;border-bottom:none;margin-bottom:6px}
.hint{color:#6b7280;font-size:14px;margin:4px 0}
</style>
<div class="top"><div class="head"><h1>三角洲行动撞车监测</h1><p class="sub">本地运营面板 · 录制/授权/出片：V1</p></div><span class="pill"><i></i>每 5 秒自动刷新</span></div>
<section class="card"><div class="card-head"><h2>监控主播</h2><span class="count" id="count"></span></div>
<div class="tbl"><table><thead><tr><th class="c-name">主播名字</th><th class="c-view">观看人数</th><th class="c-code">当前局代码</th></tr></thead>
<tbody id="streamers"></tbody></table></div></section>
<section class="card"><div class="card-head"><h2>撞车事件</h2><span class="count">最近 100 条</span></div><ul id="collisions" class="evt"></ul></section>
<section class="card"><div class="card-head"><h2>素材清单</h2></div><p class="hint">整局录制已按决策后移至 V1，当前无素材可发布。</p></section>
<script>
const fmt=n=>n==null?'-':(n>=10000?Math.round(n/1000)/10+'万':String(n));
const stInfo=x=>{if(x.status==='live')return['直播中','live'];if(x.status==='starting')return['正在连接','starting'];if(x.status==='reconnecting')return['重连中','reconnecting'];if(x.monitor_enabled)return['等待开播','standby'];return['未直播','off']};
async function load(){let s=await (await fetch('/api/streamers')).json(),c=await (await fetch('/api/collisions')).json();
// 显示：直播中（须已有会话 online）＋ 已检测到直播但尚未连上（starting/重连中）；
// offline/disabled 的历史行仍隐藏，避免面板被淹没。
const shown=s.filter(x=>x.online||x.status==='starting'||x.status==='reconnecting').sort((a,b)=>(b.viewer_count??-1)-(a.viewer_count??-1));
const waiting=s.filter(x=>x.monitor_enabled&&!(x.online||x.status==='starting'||x.status==='reconnecting')).length;
document.querySelector('#count').textContent='共 '+shown.length+' 位直播/连接中'+(waiting?'（另有 '+waiting+' 位等待开播已隐藏）':'');
document.querySelector('#streamers').innerHTML=shown.map(x=>{const[st,cls]=stInfo(x);const src=x.source==='manual'?'手动':'板块';return `<tr><td class="c-name"><div class="who"><b>${x.name}</b><span class="badge ${cls}">${st}</span></div><div class="meta">${x.platform} · 房号 ${x.room_id} · 来源：${src}</div></td><td class="c-view">${fmt(x.viewer_count)}</td><td class="c-code">${x.current_match_code?`<code>${x.current_match_code}</code>`:'<span class="na">暂无</span>'}</td></tr>`}).join('')||'<tr><td class="empty" colspan="3">当前暂无直播中的主播</td></tr>';
document.querySelector('#collisions').innerHTML=c.map(x=>`<li class="hit"><b>${x.names}</b> 撞车（代码 ${x.match_code}，${x.started_at}）</li>`).join('')||'<li class="none">暂无事件</li>'}
load();setInterval(load,5000);
</script></html>
