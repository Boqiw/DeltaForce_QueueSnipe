[project]
name = "samegame-monitor"
version = "0.1.0"
description = "Local live-stream same-match monitor"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["samegame*"]

[project.optional-dependencies]
vision = ["opencv-python>=4.9", "rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
samegame = "samegame.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
